<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كافي طيران الرياض</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f7f2ff;color:#28143e}
header{background:#54218a;color:white;text-align:center;padding:30px 15px}
header h1{font-size:30px;margin:8px}
header p{font-size:17px}
.plane{font-size:45px}
h2{text-align:center;color:#54218a}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.item{background:white;border-radius:15px;padding:17px;text-align:center;box-shadow:0 2px 8px #ddd}
.item .emoji{font-size:38px}
.item button, .send{background:#6425a0;color:white;border:0;border-radius:10px;padding:11px;width:100%;font-size:16px}
.price{color:#6425a0;font-weight:bold}
.cart,form{background:white;margin:15px;padding:18px;border-radius:15px}
input,select{width:100%;padding:13px;margin:7px 0;border:1px solid #ccc;border-radius:9px;font-size:16px}
footer{text-align:center;padding:20px;background:#54218a;color:white}
</style>
</head>
<body>

<header>
<div class="plane">✈️</div>
<h1>كافي طيران الرياض</h1>
<p>قهوتك وجهتك القادمة 💜</p>
</header>

<h2>☕ المنيو</h2>
<div class="menu">
<div class="item">
<div class="emoji">☕</div>
<h3>قهوة سودا</h3>
<p class="price">8 ريال</p>
<button onclick="add('قهوة سودا',8)">أضف للسلة</button>
</div>
<div class="item">
<div class="emoji">🧊</div>
<h3>قهوة باردة</h3>
<p class="price">14 ريال</p>
<button onclick="add('قهوة باردة',14)">أضف للسلة</button>
</div>
<div class="item">
<div class="emoji">🍹</div>
<h3>موهيتو</h3>
<p class="price">12 ريال</p>
<button onclick="add('موهيتو',12)">أضف للسلة</button>
</div>
<div class="item">
<div class="emoji">🍰</div>
<h3>كيك شوكولاتة</h3>
<p class="price">15 ريال</p>
<button onclick="add('كيك شوكولاتة',15)">أضف للسلة</button>
</div>
<div class="item">
<div class="emoji">🍓</div>
<h3>تشيز كيك توت</h3>
<p class="price">16 ريال</p>
<button onclick="add('تشيز كيك توت',16)">أضف للسلة</button>
</div>
</div>

<div class="cart">
<h2>🛒 سلة الطلبات</h2>
<div id="cart">السلة فارغة</div>
<h3 id="total">المجموع: 0 ريال</h3>
</div>

<form onsubmit="sendOrder(event)">
<h2>✈️ إتمام الطلب</h2>
<input id="name" placeholder="الاسم" required>
<input id="phone" placeholder="رقم الجوال" type="tel" required>
<select id="delivery">
<option>استلام من الكافي</option>
<option>توصيل للبيت</option>
</select>
<input id="address" placeholder="العنوان (للتوصيل)">
<button class="send" type="submit">تأكيد الطلب</button>
</form>

<footer>
كافي طيران الرياض ✈️<br>
قهوتك وجهتك القادمة 💜
</footer>

<script>
let items=[];
function add(name,price){
let found=items.find(x=>x.name===name);
if(found)found.qty++;
else items.push({name,price,qty:1});
show();
}
function show(){
let box=document.getElementById('cart');
if(items.length===0){box.innerHTML='السلة فارغة';}
else{
box.innerHTML=items.map(x=>
`<p>${x.name} × ${x.qty} — ${x.price*x.qty} ريال
<button onclick="removeItem('${x.name}')">حذف</button></p>`
).join('');
}
let sum=items.reduce((a,x)=>a+x.price*x.qty,0);
document.getElementById('total').innerText='المجموع: '+sum+' ريال';
}
function removeItem(name){
items=items.filter(x=>x.name!==name);
show();
}
function sendOrder(e){
e.preventDefault();
if(items.length===0){alert('أضف منتجاً للسلة أولاً');return;}
alert('تم تجهيز طلبك التجريبي! نرجو مراجعة الكافي لتأكيد الطلب.');
}
</script>
</body>
</html>
